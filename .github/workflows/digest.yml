name: Build daily digest and RSS feed

on:
  schedule:
    # Target: the digest is ready by 05:00 in Toronto, so the run starts at
    # 04:30 local time.
    #
    # GitHub cron is always UTC and cannot follow daylight saving, so we
    # schedule two slots and let the guard step keep the one that is really
    # 04:30 in Toronto:
    #   winter (EST, UTC-5) -> 09:30 UTC
    #   summer (EDT, UTC-4) -> 08:30 UTC
    # The guard below drops the run that does not land at 04:xx local time,
    # so exactly one run per day actually does the work.
    - cron: '30 8 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check local time in Toronto
        id: tz
        run: |
          HOUR="$(TZ=America/Toronto date +%H)"
          MIN="$(TZ=America/Toronto date +%M)"
          echo "Toronto time now: ${HOUR}:${MIN}"
          # Accept 04:xx and also a late run (05:00-05:40), because GitHub
          # sometimes starts scheduled jobs several minutes behind.
          if [ "$HOUR" = "04" ] || { [ "$HOUR" = "05" ] && [ "$MIN" -lt 40 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 04:xx in Toronto (daylight saving slot) - skipping."
          fi

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || steps.tz.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || steps.tz.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Collect posts from Telegram channels
        if: github.event_name == 'workflow_dispatch' || steps.tz.outputs.run == 'true'
        run: |
          python3 collect.py --channels-file channels.txt --out state/posts.json

      - name: Build markdown digest
        if: github.event_name == 'workflow_dispatch' || steps.tz.outputs.run == 'true'
        run: |
          DATE="$(TZ=America/Toronto date +%F)"
          python3 build_digest.py --posts state/posts.json --date "$DATE" --out "digest-$DATE.md"

      - name: Render RSS feed
        if: github.event_name == 'workflow_dispatch' || steps.tz.outputs.run == 'true'
        run: |
          DATE="$(TZ=America/Toronto date +%F)"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          BASE="https://${OWNER}.github.io/${REPO}"
          python3 render.py "digest-$DATE.md" \
            --out feed.xml \
            --feed-url "${BASE}/feed.xml" \
            --item-link "${BASE}/"
          # Some readers (FeedFox among them) accept a feed only when it is
          # served as application/rss+xml. GitHub Pages decides the type by
          # extension, so keep an .rss copy next to the .xml one.
          cp feed.xml feed.rss

      - name: Commit and push
        if: github.event_name == 'workflow_dispatch' || steps.tz.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml feed.rss state/posts.json
          if git diff --cached --quiet; then
            echo "No changes; nothing to commit."
          else
            git commit -m "Update digest and RSS feed"
            git push
          fi
